<title>Solution Summary Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: architect's workbench — a step rail on the left, one working sheet on the right; the HLD is drawn like a blueprint plate. */
:root {
  --paper: #f3f6f7;
  --panel: #ffffff;
  --sunk: #eaf0f2;
  --ink: #10202b;
  --muted: #586a74;
  --line: #d3dce0;
  --accent: #0e6a73;
  --accent-ink: #ffffff;
  --accent-soft: #dcefef;
  --signal: #b8400d;
  --signal-soft: #fbe7dc;
  --ok: #2c7a4b;
  --plate: #f8fbfb;
  --plate-line: #b7c6cb;
  --tpl-th: #cfe2f3; --tpl-band: #eef4fb; --tpl-rule: #1b1b1b;
  --aws: #ff9900; --azure: #0078d4; --gcp: #34a853; --huawei: #e60012; --alibaba: #ff6a00;
  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0d1519; --panel: #142027; --sunk: #101b21; --ink: #e2ebee; --muted: #93a6ae; --line: #253740;
  --accent: #4db5bd; --accent-ink: #062226; --accent-soft: #15353a; --signal: #f2905f; --signal-soft: #3a2116; --ok: #6cc391;
  --plate: #0f1a1f; --plate-line: #2f4650; --tpl-th: #1f3550; --tpl-band: #17263a; --tpl-rule: #8fa3ad; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0d1519; --panel: #142027; --sunk: #101b21; --ink: #e2ebee; --muted: #93a6ae; --line: #253740;
  --accent: #4db5bd; --accent-ink: #062226; --accent-soft: #15353a; --signal: #f2905f; --signal-soft: #3a2116; --ok: #6cc391;
  --plate: #0f1a1f; --plate-line: #2f4650; --tpl-th: #1f3550; --tpl-band: #17263a; --tpl-rule: #8fa3ad; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5 }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
.mono { font-family: var(--f-mono) }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 20px }
header.top h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 800; letter-spacing: -0.01em }
header.top p { margin: 4px 0 0; color: var(--muted); max-width: 62ch }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px }

.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 24px; align-items: start }
nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 4px }
.rail button { all: unset; cursor: pointer; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; padding: 9px 10px; border-radius: var(--r); color: var(--muted) }
.rail button:hover { background: var(--sunk); color: var(--ink) }
.rail button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.rail button[aria-current="step"] { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line) }
.rail .n { font-family: var(--f-mono); font-size: 12px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel) }
.rail button[aria-current="step"] .n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.rail .t { font-weight: 600; font-size: 14px; line-height: 1.2 }
.rail .s { display: block; font-weight: 400; font-size: 12px; color: var(--muted) }
.rail hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0 }
.provider-card { margin-top: 8px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); font-size: 13px; display: flex; flex-direction: column; gap: 2px }
.provider-card .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.provider-card .big { font-family: var(--f-display); font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px }
.provider-card .total { font-family: var(--f-mono); font-size: 18px; font-variant-numeric: tabular-nums; margin-top: 6px }
.provider-card .row { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums }

main.sheet { min-width: 0 }
section.step { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: clamp(16px, 2.4vw, 28px) }
.step-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .06em; color: var(--accent); text-transform: uppercase }
.step-head h2 { font-size: 24px; font-weight: 700; margin-top: 4px }
.step-head p { margin: 6px 0 0; color: var(--muted); max-width: 66ch }
.example-flag { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--signal-soft); color: var(--signal); font-weight: 600; white-space: nowrap }

fieldset { border: 0; padding: 0; margin: 0 0 22px; min-width: 0 }
legend { font-family: var(--f-display); font-weight: 700; font-size: 15px; margin-bottom: 10px; padding: 0 }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 16px }
.grid.wide { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0 }
label.f span.hint { font-size: 12px }
input[type=text], input[type=number], input[type=date], select, textarea {
  font: inherit; font-size: 14px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; width: 100%; min-width: 0 }
textarea { resize: vertical; min-height: 70px }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent) }
.checks { display: flex; flex-wrap: wrap; gap: 8px }
.chk { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 99px; background: var(--paper); font-size: 14px; cursor: pointer }
.chk:has(input:checked) { border-color: var(--accent); background: var(--accent-soft) }
.chk input { accent-color: var(--accent); margin: 0 }

button.btn { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer }
button.btn:hover { border-color: var(--accent) }
button.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
button.btn.ghost { background: transparent }
button.btn.small { font-size: 13px; padding: 5px 10px }
button.btn:disabled { opacity: .55; cursor: default }
.nav-foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line) }

/* Pain points */
.pp-list { display: flex; flex-direction: column; gap: 10px }
.pp-row { display: grid; grid-template-columns: 64px minmax(0, 2.2fr) minmax(0, 1.4fr) minmax(0, 1.3fr) 36px; gap: 8px; align-items: center }
.pp-id { font-family: var(--f-mono); font-size: 13px; color: var(--signal); font-weight: 500 }
.pp-head { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.icon-btn { all: unset; cursor: pointer; width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r); color: var(--muted) }
.icon-btn:hover { background: var(--sunk); color: var(--signal) }
.icon-btn:focus-visible { outline: 2px solid var(--accent) }

/* Scope of services */
.scope-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; padding: 14px 16px; background: var(--sunk); border-radius: 8px; margin-bottom: 20px }
.scope-bar .stat { display: flex; flex-direction: column; min-width: 110px }
.scope-bar .stat b { font-family: var(--f-mono); font-size: 19px; font-variant-numeric: tabular-nums; font-weight: 500 }
.scope-bar .stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.scope-bar label.f { width: 130px }
.scope-bar .grow { flex: 1 }
.scope-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 16px; align-items: start }
.cat { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; min-width: 0 }
.cat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 14px; background: var(--paper); border-bottom: 1px solid var(--line) }
.cat-head h3 { font-size: 14.5px; font-weight: 700 }
.cat-head .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap }
.svc-row { border-top: 1px solid var(--line); padding: 9px 14px }
.svc-row:first-of-type { border-top: 0 }
.svc-row.on { background: var(--accent-soft) }
.svc-main { display: flex; align-items: flex-start; gap: 10px; cursor: pointer }
.svc-main input { accent-color: var(--accent); margin: 3px 0 0; width: 16px; height: 16px; flex: none }
.svc-main .lbl { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35 }
.svc-main .lbl small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px }
.svc-main .days { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; padding-top: 2px }
.svc-row.on .days { color: var(--accent); font-weight: 500 }
.sugg { display: inline-block; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--signal); background: var(--signal-soft); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 1px }
.sub { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 8px 12px; margin: 8px 0 2px 26px }
.sub label.f { font-size: 12px }
.sub input, .sub select { padding: 6px 8px; font-size: 13px; background: var(--panel) }
.sub .chk { font-size: 13px; padding: 5px 10px; background: var(--panel) }
.sub .full { grid-column: 1 / -1 }
.dhint { grid-column: 2 / -1; align-self: end; font-size: 12px; color: var(--muted); padding-bottom: 7px; min-width: 0 }
.dhint b { color: var(--ink); font-weight: 600 }
.linkbtn { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; margin-left: 4px }
.linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.edited { display: block; font-family: var(--f-body); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--signal); text-align: right }
@media (max-width: 520px) { .dhint { grid-column: 1 / -1; padding-bottom: 0 } }

/* Provider picker */
.providers { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 22px }
.prov { all: unset; cursor: pointer; border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--paper); display: flex; flex-direction: column; gap: 6px; position: relative }
.prov:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.prov[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent) }
.prov .dot { width: 12px; height: 12px; border-radius: 3px }
.prov b { font-family: var(--f-display); font-size: 15px }
.prov small { color: var(--muted); font-size: 12px }
.prov .est { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums }

/* HLD plate */
.plate { border: 1px solid var(--line); border-radius: 8px; background: var(--plate); overflow-x: auto }
.plate svg { display: block; min-width: 900px; width: 100% }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 10px }
.legend i { display: inline-block; width: 18px; height: 10px; vertical-align: middle; margin-right: 6px; border-radius: 2px }
.trace { margin-top: 18px; overflow-x: auto }

/* Tables */
table { border-collapse: collapse; width: 100%; font-size: 14px }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--sunk) }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: 13px; white-space: nowrap }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px }
tr.layer td { background: var(--sunk); font-family: var(--f-display); font-weight: 700; font-size: 13px; color: var(--accent) }
tr.total td { font-weight: 700; border-bottom: 0; background: var(--accent-soft) }
td input.cell { width: 86px; text-align: right; font-family: var(--f-mono); font-size: 13px; padding: 4px 6px; background: var(--panel) }
td input.cell.wide { width: 100%; text-align: left; font-family: var(--f-body) }
.badge { display: inline-block; font-family: var(--f-mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--signal-soft); color: var(--signal); margin: 1px 3px 1px 0; white-space: nowrap }
.svc { color: var(--muted); font-size: 13px }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 18px }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: var(--paper) }
.kpi .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.kpi .v { font-family: var(--f-mono); font-size: 22px; font-variant-numeric: tabular-nums; margin-top: 2px }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding: 4px 0 4px 12px; margin: 14px 0; max-width: 80ch }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px }
.status { font-size: 13px; color: var(--ok); min-height: 1.2em }
h3.sec { font-size: 16px; margin: 26px 0 10px }

/* Summary document */
.doc { max-width: 860px; font-size: 15px }
.doc h1 { font-size: 28px; font-weight: 800 }
.doc h2 { font-size: 19px; font-weight: 700; margin: 28px 0 8px; padding-top: 14px; border-top: 1px solid var(--line) }
.doc h3 { font-size: 15px; margin: 16px 0 6px }
.doc p, .doc li { max-width: 72ch }
.doc .meta { color: var(--muted); font-size: 13px; margin-top: 6px }
.doc table { margin: 0 }
.doc .tbl-wrap { margin: 8px 0 }
.doc .plate { margin: 10px 0 }
.exec-edit { margin-top: 8px }

.tpl-up { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 8px; margin: 0 0 10px; font-size: 14px }
details.com { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin: 4px 0 16px; background: var(--paper) }
details.com summary { cursor: pointer; font-weight: 600; font-size: 14px }
details.com summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* Logo upload */
.logo-up { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 14px }
.logo-box { width: 220px; height: 72px; border: 1px dashed var(--line); border-radius: 8px; display: grid; place-items: center; background: #ffffff; overflow: hidden }
.logo-box img { max-width: 200px; max-height: 60px }
.logo-box .svc { color: #586a74 }
label.upbtn { display: inline-block; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer }
label.upbtn:hover { border-color: var(--accent) }
label.upbtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px }
label.upbtn input { position: absolute; width: 1px; height: 1px; opacity: 0 }

/* Company template view */
.doc.tpl { max-width: 820px; font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; font-size: 15px; padding: clamp(14px, 3vw, 36px); border: 1px solid var(--line); border-radius: 6px; background: var(--panel) }
.tpl-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 18px }
.tpl-logo { min-height: 56px; display: flex; align-items: center }
.tpl-logo img { max-height: 60px; max-width: 240px; background: #ffffff; padding: 2px }
.tpl-logo .svc { border: 1px dashed var(--line); border-radius: 6px; padding: 10px 14px }
.tpl-title { text-align: right; font-weight: 700; line-height: 1.45 }
.doc.tpl h2.tpl-h { font-family: inherit; font-size: 15px; font-weight: 700; text-transform: uppercase; border: 0; padding: 0; margin: 26px 0 12px; display: grid; grid-template-columns: 44px 1fr }
.doc.tpl h2.tpl-h span { text-align: right; padding-right: 14px }
.tpl-body { margin-left: 44px; min-width: 0 }
.tpl-body p { text-align: justify }
.doc.tpl h3.tpl-sub { font-family: inherit; font-size: 15px; font-weight: 400; margin: 18px 0 8px; display: grid; grid-template-columns: 28px 1fr }
.doc.tpl h3 { font-family: inherit; font-size: 14.5px }
.doc.tpl .tbl-wrap { border: 0; border-radius: 0 }
.doc.tpl table { border: 1.5px solid var(--tpl-rule) }
.doc.tpl th { background: var(--tpl-th); color: var(--ink); text-align: center; font-size: 12.5px; letter-spacing: .02em; text-transform: uppercase; border: 1px solid var(--tpl-rule) }
.doc.tpl td { border: 1px solid var(--tpl-rule) }
.doc.tpl tr.layer td { background: var(--tpl-band); color: var(--ink); font-family: inherit }
.doc.tpl tr.total td { background: var(--sunk) }
.tpl-note { margin-top: 18px }
.tpl-foot { text-align: right; font-family: Cambria, Georgia, "Times New Roman", serif; font-weight: 700; font-size: 11px; line-height: 1.3; margin-top: 32px; letter-spacing: .02em }

/* Workflow tab */
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0 }
.flow .stage { position: relative; padding: 16px 18px; border: 1px solid var(--line); background: var(--paper); margin: -1px 0 0 -1px }
.flow .stage h3 { font-size: 15px; font-weight: 700; margin: 6px 0 6px }
.flow .stage p { margin: 0; font-size: 13px; color: var(--muted) }
.flow .stage .out { margin-top: 10px; font-family: var(--f-mono); font-size: 12px; color: var(--accent) }
.arch { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 18px }
.arch div { border: 1px dashed var(--plate-line); border-radius: 8px; padding: 14px; font-size: 14px }
.arch b { font-family: var(--f-display) }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr) }
  nav.rail { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px }
  .rail button { grid-template-columns: 26px auto; white-space: nowrap }
  .rail .s, .rail hr, .provider-card { display: none }
  .pp-row { grid-template-columns: 56px minmax(0, 1fr) 36px }
  .pp-row .pp-cap, .pp-row .pp-imp { grid-column: 2 / 3 }
  .pp-head { display: none }
  .sub { margin-left: 0 }
}
@media (prefers-reduced-motion: no-preference) { section.step { animation: rise .25s ease-out } @keyframes rise { from { transform: translateY(4px) } to { transform: none } } }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Solution Summary Builder</h1>
      <p>Capture the customer's setup and pain points, choose the services in scope and a cloud provider, and get a high-level diagram, a Solution Summary and a complete Bill of Materials that stay in sync.</p>
    </div>
    <div class="top-actions">
      <button class="btn ghost" id="btnExample" type="button">Load example</button>
      <button class="btn ghost" id="btnClear" type="button">Start blank</button>
    </div>
  </header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Steps"></nav>
    <main class="sheet" id="sheet"></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
(() => {
"use strict";

/* =====================================================================
   Provider catalogue — indicative on-demand list prices, USD per month
   ===================================================================== */

  if (withOverrides && pk === S.provider) S.custom.forEach((x, i) => L.push({ id: "custom" + i, custom: i, layer: LAYERS[11], comp: x.comp || "Custom line", service: x.service || "", spec: x.spec || "", qty: num(x.qty), unit: x.unit || "item", price: num(x.price), monthly: num(x.qty) * num(x.price), kind: "custom" }));
  const cloudSub = L.filter(l => l.kind === "cloud").reduce((a, l) => a + l.monthly, 0);
  const sp = Math.max(pv.support.min, cloudSub * pv.support.pct);
  L.push({ id: "support", layer: LAYERS[11], comp: "Support plan", service: sv.support[0], spec: pv.support.pct ? `${pv.support.pct * 100}% of cloud usage, min ${money(pv.support.min)}` : `Flat ${money(pv.support.min)} per month`, qty: 1, unit: "month", price: sp, monthly: sp, kind: "support" });
  L.forEach(l => { l.pp = S.pains.filter(p => p.text && CAPS[p.cap]?.lines.includes(l.id)).map(p => p.id); });
  const total = L.reduce((a, l) => a + l.monthly, 0);

  // One-time
  const b0 = { vmTotal, az };
  const cx = ctx(b0);
  const O = [];
  const rate = num(S.so.dayRate);
  SERVICES.filter(s => on(s.id)).forEach(s => { const [d, basis] = s.days(cx); O.push({ id: "ps_" + s.id, layer: CATNAME[s.cat], comp: s.label, service: "Professional services", spec: basis, qty: d, sugg: d, unit: "person-day", price: rate, kind: "ps", svcId: s.id }); });
  const tool = (id, comp, svcRef, spec, qty, unit) => { if (qty > 0) O.push({ id, layer: "Migration tooling and transfer", comp, service: svcRef[0], spec, qty, unit, price: svcRef[1], kind: "tool" }); };
  if (on("rehost")) tool("tool_server", "Server replication tool", [pv.tools.server, 0], "Free for the migration window", cx.vmOther + cx.tiers, "server");
  if (on("dbmig")) tool("tool_db", "Database replication", pv.tools.db, "Replication during migration (3 months)", 3, "month");
  if (on("datamig") && S.so.offline) tool("tool_offline", "Offline transfer appliance", pv.tools.offline, `${cx.tb} TB, about 80 TB per job`, Math.max(1, Math.ceil(cx.tb / 80)), "job");
  if (on("c2c")) tool("tool_c2c", "Source-cloud egress", [`Data transfer out of ${PROVIDERS[srcCloud()].short}`, 90], `${cx.tb} TB moved once`, Math.max(1, Math.ceil(cx.tb)), "TB");
  O.forEach(l => { if (withOverrides && S.over[l.id] && (pk === S.provider || l.kind === "ps")) { const ov = S.over[l.id]; if (ov.qty !== undefined && ov.qty !== "") { l.qty = num(ov.qty); if (l.kind === "ps") { l.manual = true; l.spec = `Manual entry (suggested ${l.sugg}: ${l.spec})`; } } if (ov.price !== undefined && ov.price !== "") { l.price = num(ov.price); l.overridden = true; } } l.amount = l.qty * l.price; });
  if (withOverrides && pk === S.provider) S.customOnce.forEach((x, i) => O.push({ id: "customOnce" + i, customOnce: i, layer: "Other one-time items", comp: x.comp || "One-time item", service: x.service || "", spec: x.spec || "", qty: num(x.qty), unit: x.unit || "item", price: num(x.price), amount: num(x.qty) * num(x.price), kind: "custom" }));
  const psSub = O.filter(l => l.kind === "ps").reduce((a, l) => a + l.amount, 0);
  if (psSub > 0 && num(S.so.contingency) > 0) O.push({ id: "contingency", layer: "Contingency", comp: "Contingency", service: "Professional services", spec: `${num(S.so.contingency)}% of services`, qty: 1, unit: "lot", price: psSub * num(S.so.contingency) / 100, amount: psSub * num(S.so.contingency) / 100, kind: "cont" });
  const onceTotal = O.reduce((a, l) => a + l.amount, 0);
  const days = O.filter(l => l.kind === "ps").reduce((a, l) => a + l.qty, 0);
  return { lines: L, total, once: O, onceTotal, days, vmTotal, az };
}

function hldSVG() {
  const pv = P(), sv = pv.svc, b = buildBom(), has = id => b.lines.some(l => l.id === id), tag = id => (b.lines.find(l => l.id === id)?.pp || []);
  const w = S.workloads, az = b.az, W = 1100;
  const txt = (x, y, t, o = {}) => `<text x="${x}" y="${y}" font-size="${o.size || 12}" font-weight="${o.weight || 400}" fill="${o.fill || "var(--ink)"}" text-anchor="${o.anchor || "start"}" ${o.mono ? 'font-family="IBM Plex Mono, monospace"' : ""}>${esc(t)}</text>`;
  const fit = (s, width, cw = 6.2) => { const n = Math.floor((width - 16) / cw); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
  const zone = (x, y, ww, hh, label, dash = false) => `<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="8" fill="none" stroke="var(--plate-line)" stroke-width="1.2" ${dash ? 'stroke-dasharray="5 4"' : ""}/>${txt(x + 10, y + 18, fit(label, ww, 6.6), { size: 11.5, weight: 600, fill: "var(--muted)" })}`;
  const badges = (x, y, ids) => ids.map((id, i) => `<g><rect x="${x + i * 46}" y="${y}" width="42" height="15" rx="3" fill="var(--signal-soft)"/>${txt(x + i * 46 + 21, y + 11, id, { size: 10, anchor: "middle", fill: "var(--signal)", mono: true })}</g>`).join("");
  const box = (x, y, ww, hh, title, sub, id, accent = false) => {
    const t = id ? tag(id).slice(0, 3) : [];
    return `<g><rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="6" fill="${accent ? "var(--accent-soft)" : "var(--panel)"}" stroke="${accent ? "var(--accent)" : "var(--plate-line)"}" stroke-width="${accent ? 1.5 : 1}"/>
    ${txt(x + 10, y + 19, fit(title, ww, 7), { size: 12.5, weight: 600 })}${sub ? txt(x + 10, y + 35, fit(sub, ww), { size: 11, fill: "var(--muted)" }) : ""}

      put(psIn, r, 2, n); put(psIn, r, 3, "Contingency"); put(psIn, r, 4, "Contingency on professional services"); put(psIn, r, 5, 1, null, "General"); put(psIn, r, 6, "lot");
      put(psIn, r, 9, contAddr ? f(`${contAddr}*SUMIF(F${top}:F${last},"man days",I${top}:I${last})`, cont.amount) : +cont.amount.toFixed(2), null, USD); r++; }
    for (let c = 2; c <= 16; c++) put(psIn, r, c, null, S_row[c]);
    put(psIn, r, 4, "Total"); psIn.getCell(r, 4).font = Object.assign(clone(S_row[4].font), { bold: true });
    put(psIn, r, 5, f(`SUMIF(F${top}:F${r - 1},"man days",E${top}:E${r - 1})`, b.days), null, "General"); put(psIn, r, 6, "man days");
    put(psIn, r, 9, f(`SUM(I${top}:I${r - 1})`, b.onceTotal), null, USD); psIn.getCell(r, 9).font = Object.assign(clone(S_row[9].font), { bold: true });
    psTotRow = r; r += 2;
    put(psIn, r, noteC ? noteC.col : 3, "Note:", S_note); r++;
    ["Effort is estimated from the inventory and scope in the Solution Summary and confirmed after detailed discovery.", "Estimated OTC = man days x the rate per man day above; change the rate or contingency and every amount recalculates."]
      .forEach(t => { put(psIn, r, noteC ? noteC.col : 3, t, clone(S_row[3])).font = Object.assign(clone(S_row[3].font), { bold: false }); r++; });
  }

  /* PS (Partner Vendor): clear the sample quotes, keep blank rows ready */
  if (psVen) {
    fillNext(psVen, /^SFA Opp ID/i, cm.oppId); fillNext(psVen, /^Vendor'?s Name/i, cm.vendor); fillNext(psVen, /^Vendor'?s Quote/i, cm.vendorQuote);
    const hdrC = find(psVen, /^No\.?$/i, 5, 2), hdr = hdrC ? hdrC.row : 12, data = hdr + 2;
    const noteC = find(psVen, /^Note:?$/i, data);
    const S_row = []; for (let c = 2; c <= 16; c++) S_row[c] = styleAt(psVen, data, c);
    const S_note = noteC ? styleAt(psVen, noteC.row, noteC.col) : S_row[3];
    clearFrom(psVen, data);
    for (let i = 0; i < 3; i++) { const r = data + i; for (let c = 2; c <= 16; c++) put(psVen, r, c, null, S_row[c]); put(psVen, r, 2, i + 1); put(psVen, r, 9, f(`G${r}*E${r}`, 0), null, USD); }
    put(psVen, data + 4, noteC ? noteC.col : 3, "Note:", S_note);
  }

  /* MS: managed services row (template formulas kept) */
  let msFee = b.lines.filter(l => l.kind === "managed").reduce((a, l) => a + l.monthly, 0), msData = null, msTot = null;
  if (ms) {
    fillNext(ms, /^SFA Opp ID/i, cm.oppId);
    const hdrC = find(ms, /^No\.?$/i, 5, 2); msData = hdrC ? hdrC.row + 1 : 11;
    const totC = find(ms, /^Total$/i, msData); msTot = totC ? totC.row : msData + 1;
    const usdHdr = find(ms, /^PHP MRC$/i); if (usdHdr) usdHdr.value = "USD MRC";
    const r = msData;
    if (on("managed")) {
      ms.getCell(r, 2).value = 1; ms.getCell(r, 3).value = "Standard Managed Services";
      ms.getCell(r, 4).value = `Cloud Managed Services covering up to USD ${Math.round(recTotal).toLocaleString("en-US")} Monthly Cloud Spend\n   * Environment monitoring, alerting and 24x7 incident response\n   * Monthly patching for ${b.vmTotal} servers\n   * Monthly service report`;
      ms.getCell(r, 5).value = +termMonths; ms.getCell(r, 5).numFmt = "General"; ms.getCell(r, 6).value = region(); ms.getCell(r, 7).value = "Monthly";
      ms.getCell(r, 8).value = +msFee.toFixed(2); ms.getCell(r, 11).value = `Base ${money(num(S.so.msBase))} + ${money(num(S.so.msServer))} per server per month`;
      ms.getCell(r, 15).value = null;
    } else {
      for (let c = 2; c <= 15; c++) { const cell = ms.getCell(r, c); if (!(cell.value && cell.value.formula)) cell.value = null; }
      ms.getCell(r, 2).value = 1; ms.getCell(r, 3).value = "Managed services not in scope"; ms.getCell(r, 8).value = 0; msFee = 0;
    }
    [8, 9, 10, 12, 13, 14, 15].forEach(c => { ms.getCell(r, c).numFmt = USD; }); [8, 9].forEach(c => ms.getCell(msTot, c).numFmt = USD);
    if (!(ms.getCell(r, 9).value && ms.getCell(r, 9).value.formula)) ms.getCell(r, 9).value = f(`H${r}*E${r}`, msFee * +termMonths);
  }

  /* SUMMARY: project fields and the cost dashboard */
  if (sm) {
    fillNext(sm, /^Project Name/i, S.customer.project); const dc = find(sm, /^Date$/i); if (dc) { const t = sm.getCell(dc.row, rightOf(sm, dc)); t.value = dateVal; }
    const pm = find(sm, /Pricing Model$/i); if (pm) { pm.value = `${pv.short} Pricing Model`; sm.getCell(pm.row, rightOf(sm, pm)).value = plan; }
    const comp = find(sm, /Components$/i); if (comp && !/^List/i.test(comp.value)) comp.value = `${pv.short} Components`;
    const hc = find(sm, /^List of Components/i); const hr = hc ? hc.row : 10, c0 = hc ? hc.col : 3, data = hr + 1;
    const totC = find(sm, /^Total Cost/i, data), asC = find(sm, /^Assumptions/i, data);
    const S_d = [], S_t = []; for (let c = c0; c <= c0 + 8; c++) { S_d[c] = styleAt(sm, data, c); S_t[c] = totC ? styleAt(sm, totC.row, c) : S_d[c]; }
    const S_as = asC ? styleAt(sm, asC.row, asC.col) : S_d[c0];
    clearFrom(sm, data);
    const col = i => String.fromCharCode(64 + c0 + i);
    let r = data; const s0 = r;
    const row = (vals, fmts) => { for (let c = c0; c <= c0 + 8; c++) put(sm, r, c, null, S_d[c]); vals.forEach((v, i) => { if (v !== undefined) put(sm, r, c0 + i, v, null, fmts && fmts[i]); }); r++; };
    subRows.forEach(([gname, br, sum]) => row([`${pv.short} Subscription | ${gname}`, gname === "Software and Licences" ? "Annual plan" : plan, "None", f(`BOM!G${br}`, sum), "n/a", "n/a", "n/a"], [, , , USD]));
    if (ms && on("managed")) row(["Cloud Managed Service", "Monthly", "None", f(`MS!H${msTot}`, msFee), "n/a", "n/a", "n/a"], [, , , USD]);
    if (psIn && psTotRow) row(["PS Implementation", "One-time", "None", null, f(`'${psName.replace(/'/g, "''")}'!I${psTotRow}`, b.onceTotal), "n/a", "n/a"], [, , , USD, USD]);
    const sEnd = r - 1;
    for (let c = c0; c <= c0 + 8; c++) put(sm, r, c, null, S_t[c]);
    put(sm, r, c0, "Total Cost");
    put(sm, r, c0 + 3, f(`SUM(${col(3)}${s0}:${col(3)}${sEnd})`, recTotal + msFee), null, USD);
    put(sm, r, c0 + 4, f(`SUM(${col(4)}${s0}:${col(4)}${sEnd})`, b.onceTotal), null, USD);
    r += 2;
    put(sm, r, c0, "Assumptions", S_as); r++;
    const plain = clone(S_d[c0]); plain.border = {}; plain.fill = undefined;
    bomNotes(pv).concat([`Contract term ${termMonths} months; payment term ${payTerm}.`, "Selling price and mark-up columns are left for pricing approval, as in the template."])
      .forEach(t => { put(sm, r, c0, "• " + t, plain); r++; });
  }
  return wb.xlsx.writeBuffer();
}

async function doSheet(btn) {
  if (!window.ExcelJS?.Workbook) { say("The Google Sheets export did not load. Check your connection and reload the page.", "var(--signal)"); return; }
  const dl = await downloads(); if (!dl) { say("Saving files is not available here.", "var(--signal)"); return; }
  btn.disabled = true; say("Building spreadsheet...", "var(--muted)");
  try {
    const useTpl = !!tplBuffer();
    const buf = useTpl ? await buildBomFromTemplate() : await buildBomXlsx();
    const filename = bomFileName();
    await dl.save({ filename, data: buf }); say(`Saved ${filename}${useTpl ? " from your BOM template" : " (built-in layout; upload your BOM template above to export into it)"}. In Google Drive, choose New > File upload, then open it with Google Sheets.`, "var(--ok)");
  } catch (e) { say(e?.code === "declined" ? "Save cancelled." : e?.code === "rate_limited" ? "A save prompt is already open." : "Could not build the spreadsheet.", "var(--signal)"); }
  finally { btn.disabled = false; }
}

/* =====================================================================
   Events
   ===================================================================== */
let rerenderT;
function softRender() { clearTimeout(rerenderT); rerenderT = setTimeout(() => { if (step < 2) { renderRail(); return; } const active = document.activeElement?.id; render(); const el = active && document.getElementById(active); if (el) { el.focus(); if (el.setSelectionRange && el.type !== "number") { try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {} } } }, 400); }
document.addEventListener("input", e => {
  const t = e.target; if (t.type === "checkbox" || t.tagName === "SELECT") return;
  if (t.dataset.bind) { const old = getPath(S, t.dataset.bind); setPath(S, t.dataset.bind, typeof old === "number" ? num(t.value) : t.value); S.isExample = false; save(); softRender(); }
  else if (t.dataset.pp !== undefined) { S.pains[+t.dataset.pp][t.dataset.k] = t.value; save(); softRender(); }
  else if (t.dataset.ov) { const o = S.over[t.dataset.ov] || (S.over[t.dataset.ov] = {}); o[t.dataset.k] = t.value; save(); softRender(); }
  else if (t.dataset.cu !== undefined) { S.custom[+t.dataset.cu][t.dataset.k] = (t.dataset.k === "qty" || t.dataset.k === "price") ? num(t.value) : t.value; save(); softRender(); }
  else if (t.dataset.co !== undefined) { S.customOnce[+t.dataset.co][t.dataset.k] = (t.dataset.k === "qty" || t.dataset.k === "price") ? num(t.value) : t.value; save(); softRender(); }
});
function processLogo(file) {
  const st = $("#logoSt"), fail = msg => { if (st) { st.style.color = "var(--signal)"; st.textContent = msg; } };
  if (!file) return;
  if (!/^image\/(png|jpeg)$/.test(file.type)) { fail("Use a PNG or JPG image."); return; }
  if (file.size > 8 * 1024 * 1024) { fail("That image is over 8 MB. Use a smaller logo file."); return; }
  const rd = new FileReader();
  rd.onerror = () => fail("Could not read that file.");
  rd.onload = () => { const img = new Image();
    img.onerror = () => fail("That file is not a readable image.");
    img.onload = () => { const k = Math.min(1, 720 / img.naturalWidth, 240 / img.naturalHeight); const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h; const g = cv.getContext("2d");
      if (file.type === "image/jpeg") { g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h); }
      g.drawImage(img, 0, 0, w, h);
      S.brand.logo = cv.toDataURL(file.type === "image/jpeg" ? "image/jpeg" : "image/png", 0.92); S.brand.logoW = w; S.brand.logoH = h; save(); render(); };
    img.src = rd.result; };
  rd.readAsDataURL(file);
}
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "logoFile") { processLogo(t.files && t.files[0]); return; }
  if (t.id === "tplFile") { processTemplate(t.files && t.files[0]); return; }
  if (t.dataset.scope) { const id = t.dataset.scope; S.scope[id] = t.checked; if (!t.checked) delete S.scope[id]; SVC[id].sync?.(t.checked); S.isExample = false; save(); render(); return; }
  if (t.type === "checkbox" || t.tagName === "SELECT") {
    if (t.dataset.bind) { setPath(S, t.dataset.bind, t.type === "checkbox" ? t.checked : t.value);
      if (t.dataset.bind === "nfr.dr" && !t.checked) delete S.scope.drdesign; if (t.dataset.bind === "workloads.k8s") { if (t.checked) S.scope.k8s = true; else delete S.scope.k8s; }
      S.isExample = false; save(); render(); }
    else if (t.dataset.pp !== undefined) { S.pains[+t.dataset.pp][t.dataset.k] = t.value; save(); renderRail(); }
  }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.step !== undefined) go(+b.dataset.step);
  else if (b.dataset.go !== undefined) go(+b.dataset.go);
  else if (b.dataset.prov) { S.provider = b.dataset.prov; S.region = ""; S.drRegion = ""; S.over = Object.fromEntries(Object.entries(S.over).filter(([k]) => k.startsWith("ps_"))); save(); render(); }
  else if (b.dataset.delpp !== undefined) { S.pains.splice(+b.dataset.delpp, 1); S.pains.forEach((p, i) => p.id = "PP-" + String(i + 1).padStart(2, "0")); save(); render(); }
  else if (b.id === "addPain") { S.pains.push({ id: "PP-" + String(S.pains.length + 1).padStart(2, "0"), text: "", impact: "", cap: "security" }); save(); render(); document.getElementById("pp-t-" + (S.pains.length - 1))?.focus(); }
  else if (b.id === "tplClear") clearTemplate();
  else if (b.id === "logoClear") { S.brand.logo = ""; S.brand.logoW = 0; S.brand.logoH = 0; save(); render(); }
  else if (b.dataset.resetdays) { const ov = S.over["ps_" + b.dataset.resetdays]; if (ov) { delete ov.qty; if (!Object.keys(ov).length) delete S.over["ps_" + b.dataset.resetdays]; } save(); render(); }
  else if (b.dataset.delcu !== undefined) { S.custom.splice(+b.dataset.delcu, 1); save(); render(); }
  else if (b.dataset.delco !== undefined) { S.customOnce.splice(+b.dataset.delco, 1); save(); render(); }
  else if (b.dataset.dl) doDownload(b.dataset.dl);
  else if (b.dataset.pdf) doPDF(b.dataset.pdf, b);
  else if (b.dataset.gdoc) doGDoc(b.dataset.gdoc, b);
  else if (b.dataset.xlsx) doSheet(b);
  else if (b.dataset.copy) doCopy(b.dataset.copy);
  else if (b.id === "btnExample" || b.id === "btnClear") { const keep = { brand: S.brand, docFormat: S.docFormat, com: Object.assign(defaults().com, { company: S.com.company }) }; S = Object.assign(b.id === "btnExample" ? example() : defaults(), keep); step = 0; save(); render(); }
});

render();
})();
